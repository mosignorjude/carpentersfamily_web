name: Security and production-build checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
    permissions:
      contents: read
    steps:
      - name: Check out source without persisting the token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run security regression suite
        run: npm run test:security-regression

      - name: Build production application
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/next-server.log 2>&1 &
          echo $! > /tmp/next-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/next-server.log
          exit 1

      - name: Verify production HTTP security headers
        env:
          DEPLOYMENT_BASE_URL: http://127.0.0.1:3000
        run: node --test tests/deployment-security-headers.test.mjs

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/next-server.pid ]; then
            kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/next-server.log ]; then
            cat /tmp/next-server.log
          fi
